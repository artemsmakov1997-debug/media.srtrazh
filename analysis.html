<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Анализ публикаций — МЕДИА.СТРАЖ</title>
  <meta name="description" content="Автоматический анализ публикаций СМИ и самостоятельная проверка текстов.">
  <link rel="icon" href="favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: dark;
      --bg: #05070b;
      --panel: #0b111a;
      --panel-2: #0e1722;
      --line: #202d3b;
      --line-strong: #304153;
      --text: #edf3f8;
      --muted: #9eacbb;
      --cyan: #22d3ee;
      --red: #ff7777;
      --yellow: #f2c66d;
      --green: #7ed6a0;
      font-family: Inter, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); }
    a { color: var(--cyan); text-decoration: none; }
    a:hover { text-decoration: underline; }
    button, input, textarea, select { font: inherit; }
    button, select, input, textarea { color: inherit; }
    [hidden] { display: none !important; }
    :focus-visible { outline: 2px solid var(--yellow); outline-offset: 3px; }
    .site-header { border-bottom: 1px solid var(--line); }
    .header-inner { max-width: 1180px; margin: auto; padding: 18px 24px; display: flex; justify-content: space-between; align-items: center; gap: 24px; }
    .brand { margin: 0; font: 800 14px/1.2 Montserrat, sans-serif; letter-spacing: .09em; color: var(--cyan); }
    .header-back { display: inline-flex; align-items: center; gap: 9px; padding: 10px 13px; border: 1px solid var(--line-strong); border-radius: 6px; color: var(--text); font-size: 13px; font-weight: 600; white-space: nowrap; }
    .header-back:hover { border-color: var(--cyan); color: var(--cyan); text-decoration: none; }
    main { max-width: 1180px; margin: auto; padding: 26px 24px 64px; }
    h1, h2, h3 { font-family: Montserrat, Inter, sans-serif; }
    h1 { margin: 0 0 14px; font-size: clamp(30px, 4vw, 44px); line-height: 1.15; letter-spacing: -.035em; }
    h2 { font-size: 21px; line-height: 1.3; }
    h3 { font-size: 16px; line-height: 1.4; }
    p { line-height: 1.65; }
    .lead { color: #c0ccd8; max-width: 760px; margin: 0; }
    .notice { margin: 24px 0 0; padding: 14px 16px; border: 1px solid #24404b; border-left: 3px solid var(--cyan); border-radius: 6px; background: #0a131a; color: #c8d5df; font-size: 14px; }
    .section-head { display: flex; justify-content: space-between; align-items: end; gap: 20px; margin-bottom: 16px; }
    .section-head h2 { margin: 0; }
    .eyebrow { margin: 0 0 8px; color: var(--cyan); font-size: 11px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
    .muted { color: var(--muted); }
    .analysis-tabs { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 14px; margin: 0 0 18px; }
    .mode-card { display: flex; flex-direction: column; align-items: flex-start; justify-content: center; text-align: left; min-height: 88px; padding: 18px; border: 1px solid var(--line-strong); border-radius: 10px; background: var(--panel); cursor: pointer; transition: border-color .15s, background .15s; }
    .mode-card { border-color: #3b5969; background: #101a25; }
    .mode-card:hover { border-color: #66e4f3; background: #142633; }
    .mode-card.active { border-color: var(--cyan); background: #102b36; box-shadow: inset 0 0 0 1px rgba(34,211,238,.28); }
    .mode-card.active strong { color: #e8fbff; }
    .mode-card:not(.active) strong { color: #c9d8e5; }
    .mode-number { color: var(--cyan); font: 700 12px Montserrat, sans-serif; letter-spacing: .08em; }
    .mode-card strong { margin: 0; font: 700 18px Montserrat, sans-serif; }
    .mode-card .mode-number { display: none; }
    .section-panel { padding: 24px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); }
    .section-panel > .section-head { margin-bottom: 10px; }
    .manual-form, .manual-document { background: var(--panel-2); border: 1px solid var(--line-strong); border-radius: 8px; padding: 20px; }
    .manual-form label, .field-label { display: block; font-weight: 600; font-size: 14px; margin-bottom: 8px; }
    .manual-form input, .manual-form textarea { width: 100%; padding: 12px 13px; margin-bottom: 18px; border: 1px solid #344658; border-radius: 6px; background: #070c12; color: inherit; font: inherit; }
    .manual-form textarea { min-height: 220px; resize: vertical; }
    .manual-actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
    .button { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 11px 16px; border: 1px solid var(--cyan); border-radius: 6px; background: var(--cyan); color: #041116; font-weight: 700; cursor: pointer; }
    .button:hover { background: #72e6f4; text-decoration: none; }
    .button.secondary { background: transparent; border-color: #405365; color: var(--text); }
    .button.secondary:hover { border-color: var(--cyan); color: var(--cyan); }
    .button:disabled { opacity: .5; cursor: wait; }
    .error { color: #ffaaa5; }
    .manual-document { margin: 20px 0; }
    .manual-document .context { overflow-wrap: anywhere; max-height: 450px; overflow-y: auto; }
    #manualFindings .finding { overflow-wrap: anywhere; }
    #manualResultTitle:focus { outline: none; }
    .stats-line { display: flex; flex-wrap: wrap; gap: 8px 18px; padding: 12px 0 16px; color: var(--muted); font-size: 13px; border-bottom: 1px solid var(--line); }
    .collection-status { margin: 14px 0; }
    .collection-status > summary { color: var(--muted); font-size: 13px; }
    #selection { color: var(--muted); font-size: 13px; }
    .sources { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 12px; margin: 18px 0 22px; }
    .source { padding: 16px; border: 1px solid var(--line); border-radius: 8px; background: #080d13; overflow-wrap: anywhere; }
    .source h3 { margin: 0 0 8px; }
    .source p { margin: 5px 0; font-size: 13px; }
    .controls { display: grid; grid-template-columns: minmax(170px,1fr) minmax(170px,1fr) auto; gap: 14px; align-items: end; padding: 18px; border: 1px solid var(--line); border-radius: 8px; background: #080d13; margin: 22px 0 18px; }
    .control-field label { display: block; margin-bottom: 7px; color: var(--muted); font-size: 12px; font-weight: 600; }
    select { width: 100%; min-height: 42px; padding: 9px 34px 9px 11px; border: 1px solid #344658; border-radius: 6px; background: #0b121a; }
    .check-field { display: flex; gap: 9px; align-items: center; min-height: 42px; font-size: 13px; color: #c7d1db; }
    input[type="checkbox"] { accent-color: var(--cyan); width: 16px; height: 16px; }
    .publication { margin: 14px 0; padding: 20px; border: 1px solid var(--line); border-radius: 8px; background: #080d13; overflow-wrap: anywhere; }
    .publication h2 { margin: 8px 0 12px; font-size: 18px; }
    .publication > p { margin: 8px 0; }
    .publication > p:first-child { font-size: 13px; }
    .publication-meta { color: var(--muted); font-size: 13px; margin: 0 0 8px; }
    .publication-actions { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: end; gap: 12px; margin-top: 18px; }
    .publication-actions details { margin: 0; padding: 0; border: 0; min-width: 0; }
    .publication-actions summary { list-style: none; display: inline-flex; align-items: center; padding: 10px 15px; border: 1px solid var(--cyan); border-radius: 6px; color: var(--cyan); font-weight: 700; cursor: pointer; }
    .publication-actions summary::-webkit-details-marker { display: none; }
    .publication-actions .source-link { display: inline-flex; align-items: center; justify-content: center; padding: 10px 15px; border: 1px solid #405365; border-radius: 6px; color: var(--text); font-weight: 700; text-decoration: none; }
    .publication-actions .source-link:hover { border-color: var(--cyan); color: var(--cyan); }
    .badge { color: var(--cyan); font-size: 13px; }
    .finding { padding: 18px 0; border-bottom: 1px solid var(--line); }
    details { border-top: 1px solid var(--line); padding-top: 14px; margin-top: 14px; }
    summary { cursor: pointer; line-height: 1.5; color: #d9e3ec; }
    blockquote { margin: 14px 0; padding: 12px 16px; border-left: 3px solid var(--cyan); white-space: pre-wrap; }
    .context { white-space: pre-wrap; line-height: 1.65; }
    mark { color: #041116; background: var(--cyan); }
    .bottom-note { margin-top: 30px; padding-top: 18px; border-top: 1px solid var(--line); font-size: 13px; }
    @media (max-width: 760px) {
      .header-inner { align-items: center; flex-direction: row; gap: 12px; padding: 14px 16px; }
      .brand { font-size: 12px; }
      .header-back { padding: 9px 10px; font-size: 12px; }
      main { padding: 20px 16px 48px; }
      .analysis-tabs { grid-template-columns: 1fr; }
      .mode-card { min-height: 72px; }
      .section-panel { padding: 16px; }
      .sources { grid-template-columns: 1fr; }
      .controls { grid-template-columns: 1fr; padding: 14px; }
      .section-head { align-items: flex-start; flex-direction: column; }
    }
  </style>
  <script src="analysis.js" defer></script>
  <script src="manual-analysis.js" defer></script>
</head>
<body>
<header class="site-header">
  <div class="header-inner">
    <p class="brand">МЕДИА.СТРАЖ</p>
    <a class="header-back" href="index.html"><span aria-hidden="true">←</span> Вернуться к рейтингу</a>
  </div>
</header>
<main>
  <div class="analysis-tabs" role="group" aria-label="Выбор режима анализа">
    <button class="mode-card active" type="button" data-mode="automatic" aria-pressed="true">
      <span class="mode-number">01 / АВТОМАТИЧЕСКИЙ</span>
      <strong>Автоматический анализ</strong>
    </button>
    <button class="mode-card" type="button" data-mode="manual" aria-pressed="false">
      <span class="mode-number">02 / САМОСТОЯТЕЛЬНЫЙ</span>
      <strong>Самостоятельный анализ</strong>
    </button>
  </div>

  <section id="automaticPanel" class="section-panel" aria-label="Автоматический анализ">
    <div class="controls" id="controls">
      <div class="control-field">
        <label for="platform">Площадка публикации</label>
        <select id="platform">
          <option value="">Все площадки</option>
          <option value="website">Сайты изданий</option>
          <option value="telegram">Telegram</option>
        </select>
      </div>
      <div class="control-field">
        <label for="source">Издание / канал</label>
        <select id="source">
          <option value="">Все издания</option>
          <optgroup label="Источники в текущей подборке">
            <option value="rt">RT на русском</option>
            <option value="tass">ТАСС</option>
            <option value="ria">РИА Новости</option>
          </optgroup>
          <optgroup label="Другие русскоязычные политические СМИ">
            <option value="interfax">Интерфакс</option>
            <option value="kommersant">Коммерсантъ</option>
            <option value="vedomosti">Ведомости</option>
            <option value="rbc">РБК</option>
            <option value="izvestia">Известия</option>
            <option value="rg">Российская газета</option>
            <option value="lenta">Лента.ру</option>
            <option value="meduza">Медуза</option>
            <option value="novayagazeta">Новая газета Европа</option>
            <option value="fontanka">Фонтанка</option>
            <option value="currenttime">Настоящее Время</option>
            <option value="dw">DW на русском</option>
            <option value="bbc">BBC News Русская служба</option>
          </optgroup>
        </select>
      </div>
      <label class="check-field"><input type="checkbox" id="candidates"> Показать публикации с фрагментами для проверки</label>
    </div>
    <p id="error" class="error" role="alert" hidden></p>
    <details id="collectionStatus" class="collection-status">
      <summary><span id="collectionState" role="status" aria-live="polite">Загружаем состояние источников…</span></summary>
      <p id="updated" class="muted">Загружаем подборку…</p>
      <div id="totals" class="stats-line"></div>
      <div id="sources" class="sources"></div>
      <details id="coverageBlock" hidden><summary>Охват анализа</summary><p id="coverage" class="muted"></p></details>
    </details>
    <p id="selection" role="status" aria-live="polite"></p>
    <div id="articles"></div>
  </section>

  <section id="manualPanel" class="section-panel manual" aria-label="Самостоятельный анализ" hidden>
    <noscript><p class="error">Для ручного анализа включите JavaScript в браузере.</p></noscript>
    <form id="manualForm" class="manual-form" autocomplete="off">
      <label for="manualTitle">Заголовок — необязательно</label>
      <input id="manualTitle" maxlength="200000" spellcheck="false">
      <label for="manualText">Текст публикации</label>
      <textarea id="manualText" required maxlength="200000" spellcheck="false" placeholder="Вставьте полный текст статьи…"></textarea>
      <p class="muted">Заголовок и текст вместе — до 200 000 символов.</p>
      <div class="manual-actions">
        <button class="button" id="manualSubmit" type="submit">Проанализировать</button>
        <button class="button secondary" type="reset">Очистить</button>
        <span id="manualState" role="status" aria-live="polite"></span>
      </div>
      <p id="manualError" class="error" role="alert" hidden></p>
    </form>
    <section id="manualResult" hidden aria-labelledby="manualResultTitle">
      <h2 id="manualResultTitle" tabindex="-1">Результат ручного анализа</h2>
      <p id="manualVersion" class="muted"></p>
      <p id="manualSummary"></p>
      <div id="manualWarnings"></div>
      <details class="manual-document" open>
        <summary>Заголовок и текст с выделенными фрагментами</summary>
        <h3>Заголовок</h3><div id="manualTitleEvidence" class="context"></div>
        <h3>Текст</h3><div id="manualTextEvidence" class="context"></div>
      </details>
      <div id="manualFindings"></div>
      <details><summary>Охват ручного анализа</summary><p id="manualCoverage" class="muted"></p></details>
      <p><button id="manualDownload" class="button secondary" type="button">Скачать результат JSON</button></p>
    </section>
  </section>
</main>
<script>
  (() => {
    const automaticPanel = document.getElementById('automaticPanel');
    const manualPanel = document.getElementById('manualPanel');
    const modeButtons = Array.from(document.querySelectorAll('[data-mode]'));
    function setMode(mode) {
      const manual = mode === 'manual';
      automaticPanel.hidden = manual;
      manualPanel.hidden = !manual;
      modeButtons.forEach(button => {
        const active = button.dataset.mode === mode;
        button.classList.toggle('active', active);
        button.setAttribute('aria-pressed', String(active));
      });
      if (manual) document.getElementById('manualTitle').focus({preventScroll:true});
    }
    modeButtons.forEach(button => button.addEventListener('click', () => setMode(button.dataset.mode)));
  })();
</script>
</body>
</html>

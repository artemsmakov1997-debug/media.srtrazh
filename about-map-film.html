<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>МЕДИА.СТРАЖ — ролик с картой</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700;800;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#05070b;--cy:#22d3ee;--red:#ef4444;--mut:#a8b0bd;--tx:#f4f7fb;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:Inter,sans-serif}
body{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:16px}
.stage{container-type:inline-size;position:relative;width:min(100%,960px);aspect-ratio:16/9;overflow:hidden;border-radius:20px;border:1px solid #1f2937;
background:radial-gradient(circle at 20% 0%,rgba(34,211,238,.10),transparent 40%),radial-gradient(circle at 85% 100%,rgba(239,68,68,.09),transparent 40%),#070b14;box-shadow:0 16px 40px rgba(0,0,0,.55)}
.scene,.end{position:absolute;inset:0}
.top{position:absolute;left:5cqw;top:3.6cqw;display:flex;align-items:center;gap:1.2cqw;font:700 1.45cqw Montserrat,sans-serif;letter-spacing:.18em;text-transform:uppercase;color:var(--mut)}
.dot{width:1cqw;height:1cqw;border-radius:50%;background:var(--cy);box-shadow:0 0 1cqw var(--cy);animation:blink 1.2s infinite}
.cnt{position:absolute;right:5cqw;top:2.4cqw;display:flex;align-items:center;gap:1.6cqw}
.big{font:900 5.4cqw/1 Montserrat,sans-serif;color:var(--red);text-shadow:0 0 2cqw rgba(239,68,68,.3);letter-spacing:-.03em;min-width:7.6cqw;text-align:right}
.lab{font-size:1.25cqw;line-height:1.35;letter-spacing:.07em;text-transform:uppercase;color:var(--mut)}
.lab span{color:var(--cy);font-weight:700}
.map{position:absolute;left:5cqw;right:5cqw;top:13cqw;bottom:4cqw;width:90cqw;height:39.25cqw}
.map svg{width:100%;height:100%;display:block;overflow:visible}
.base{fill:rgba(34,211,238,.035);stroke:rgba(34,211,238,.5);stroke-width:1.4;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1}
.lit{fill:rgba(34,211,238,.17);stroke:#22d3ee;stroke-width:1.6;stroke-linejoin:round}
.grid line{stroke:rgba(148,163,184,.09);stroke-width:1}
.core{fill:var(--red);opacity:0;filter:drop-shadow(0 0 6px rgba(239,68,68,.9))}
.ring{fill:none;stroke:var(--red);stroke-width:2;opacity:0;transform-box:fill-box;transform-origin:center}
.hit .core{opacity:1}
.hit .ring{animation:ping 1.5s ease-out}
.tick{position:absolute;left:5cqw;bottom:3.2cqw;min-height:3.6cqw;box-sizing:border-box;display:flex;align-items:center;gap:1cqw;padding:.7cqw 1.6cqw;border:1px solid var(--red);border-radius:99px;color:#fecaca;font-size:1.45cqw;font-weight:600;opacity:0;transition:opacity .25s}
.tick.on{opacity:1}
.tick i{width:.9cqw;height:.9cqw;border-radius:50%;background:var(--red);flex:0 0 auto}
.end{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2cqw;opacity:0}
.logo{font:900 8cqw/1 Montserrat,sans-serif;letter-spacing:.08em;text-shadow:0 0 3cqw rgba(34,211,238,.25)}
.logo span{color:var(--cy)}
.line{width:0;height:.3cqw;background:linear-gradient(90deg,transparent,var(--cy),transparent)}
.tag{font-size:2cqw;color:var(--mut);letter-spacing:.04em}
.url{margin-top:.6cqw;padding:.9cqw 2.4cqw;border:1px solid rgba(34,211,238,.5);border-radius:99px;color:var(--cy);font:600 1.7cqw Inter,sans-serif;background:rgba(34,211,238,.07)}
button{min-height:44px;padding:0 22px;border-radius:12px;border:1px solid rgba(34,211,238,.45);background:rgba(34,211,238,.08);color:var(--cy);font:600 14px Inter,sans-serif;cursor:pointer}
button:hover{background:rgba(34,211,238,.16)}
.go .scene{animation:out .7s 7.6s both}
.go .top{animation:up .6s .2s both}
.go .cnt{animation:up .6s .5s both}
.go .grid{animation:fade 1s .2s both}
.go .base{animation:draw 2s .3s ease-out both}
.go .end{animation:fade .8s 8.3s both}
.go .logo{animation:pop 1.1s 8.3s cubic-bezier(.22,1,.36,1) both}
.go .line{animation:wide 1.2s 8.6s cubic-bezier(.22,1,.36,1) both}
.go .tag{animation:up .8s 9.1s both}
.go .url{animation:up .8s 9.6s both}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes up{from{opacity:0;transform:translateY(1.2cqw)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes out{to{opacity:0}}
@keyframes pop{from{transform:scale(.9);letter-spacing:.3em}to{transform:scale(1);letter-spacing:.08em}}
@keyframes wide{to{width:40cqw}}
@keyframes blink{50%{opacity:.25}}
@keyframes ping{0%{opacity:.9;transform:scale(1)}100%{opacity:0;transform:scale(6)}}
@media (prefers-reduced-motion:reduce){.go *{animation-duration:.01s!important;animation-delay:0s!important}.go .scene{display:none}}

/* Embedded film: preserve the 16:9 composition on desktop; fill the portrait TV on phones. */
html,body{width:100%;height:100%;overflow:hidden}
body{min-height:0;height:100vh;display:flex;align-items:center;justify-content:center;gap:0;padding:0}
.stage{width:100%;height:100%;aspect-ratio:auto;max-width:none;border:0;border-radius:0;box-shadow:none}
#replay{display:none}
@media(max-width:680px){
  .stage{width:100%;height:100%;aspect-ratio:auto}
  .top{left:6%;top:7%;gap:9px;font-size:11px;letter-spacing:.12em}
  .dot{width:7px;height:7px}
  .cnt{top:15%;right:6%;gap:10px}
  .big{font-size:clamp(35px,10vw,43px);min-width:65px}
  .lab{font-size:10px;line-height:1.35}
  .map{top:30%;left:3%;right:3%;bottom:auto;width:94%;height:45%}
  .tick{left:6%;bottom:17%;max-width:88%;min-height:32px;padding:8px 12px;gap:8px;font-size:11px;line-height:1.35}
  .tick i{width:7px;height:7px}
  .end{gap:14px;padding:0 10px;box-sizing:border-box}
  .logo{font-size:clamp(21px,7vw,33px);letter-spacing:.025em;white-space:nowrap}
  .tag{font-size:clamp(11px,3.15vw,13px);text-align:center}
  .url{font-size:12px;padding:8px 16px}
  .line{height:2px}
  .go .line{animation-name:wide-mobile}
  @keyframes wide-mobile{to{width:70%}}
}

/* The desktop monitor is wider than 16:9; render edge-to-edge without bars. */
@media(min-width:681px){
 .stage{background:radial-gradient(ellipse at 50% 105%,rgba(7,52,77,.27),transparent 75%),radial-gradient(circle at 24% 10%,rgba(34,211,238,.09),transparent 44%),radial-gradient(circle at 82% 84%,rgba(239,68,68,.055),transparent 44%),#070b14}
 .top{left:4.5%;top:6%;gap:10px;font-size:clamp(12px,1.2vw,15px);letter-spacing:.17em}
 .dot{width:8px;height:8px}
 .cnt{right:5%;top:4%;gap:12px}
 .big{font-size:clamp(42px,4.5vw,58px);min-width:68px}
 .lab{font-size:clamp(10px,1.05vw,13px)}
 .map{left:8%;right:8%;top:17%;bottom:auto;width:84%;height:77%}
 .tick{left:4.5%;bottom:6%;min-height:32px;max-width:calc(100% - 295px);padding:7px 13px;gap:8px;font-size:clamp(11px,1.04vw,13px)}
 .tick i{width:8px;height:8px}
 .end{gap:clamp(12px,2vh,18px);padding:0 4%;box-sizing:border-box}
 .logo{font-size:clamp(36px,5vw,70px)}
 .tag{font-size:clamp(13px,1.65vw,19px);text-align:center}
 .url{font-size:clamp(12px,1.35vw,16px);padding:9px 24px}
 .line{height:3px}
}
</style>

  for(var i=hits;i<D.length;i++){
    if(sx>=D[i][0]){els[i].classList.add('hit');hits=i+1;
      tt.textContent='Найден признак: '+PH[i%PH.length];tick.classList.add('on');
      clearTimeout(tmo);tmo=setTimeout(function(){tick.classList.remove('on')},1400)}
    else break}
  cnt.textContent=hits*7;
  if(t>=10.6 && !completeNotified) {
    completeNotified=true;
    window.parent.postMessage({type:'media-strazh-film-event',action:'complete'},location.origin);
  }
  if(t<13){raf=requestAnimationFrame(frame)}else{play()}
}
function animations(){return st.getAnimations({subtree:true})}
function play(){
  cancelAnimationFrame(raf);clearTimeout(tmo);hits=0;elapsed=0;paused=false;completeNotified=false;
  els.forEach(function(e){e.classList.remove('hit')});tick.classList.remove('on');
  cnt.textContent='0';scr.setAttribute('width','0');beam.setAttribute('opacity','0');
  st.classList.remove('go');void st.offsetWidth;st.classList.add('go');
  start=performance.now();
  animations().forEach(function(a){a.playbackRate=playbackRate;a.play()});
  raf=requestAnimationFrame(frame);
}
function changeRate(next){
  if(![1,2,3].includes(next))return;
  if(!paused)elapsed+=(performance.now()-start)/1000*playbackRate;
  start=performance.now();playbackRate=next;
  animations().forEach(function(a){a.playbackRate=playbackRate});
}
function pause(){
  if(paused)return;
  elapsed+=(performance.now()-start)/1000*playbackRate;
  paused=true;cancelAnimationFrame(raf);clearTimeout(tmo);
  animations().forEach(function(a){a.pause()});
}
function resume(){
  if(!paused)return;
  paused=false;start=performance.now();
  animations().forEach(function(a){a.play()});
  raf=requestAnimationFrame(frame);
}
window.addEventListener('message',function(event){
  if(event.source!==window.parent || event.origin!==location.origin)return;
  var command=event.data;
  if(!command || command.type!=='media-strazh-film-control')return;
  if(command.action==='replay')play();
  else if(command.action==='speed')changeRate(command.value);
  else if(command.action==='pause')pause();
  else if(command.action==='resume')resume();
});
document.getElementById('replay').addEventListener('click',play);
play();
</script>

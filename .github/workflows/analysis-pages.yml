name: Collect news and publish analysis

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      benchmark:
        description: Prepare an unlabelled 240-document corpus from accumulated history
        type: boolean
        default: false
  schedule:
    - cron: '17,47 * * * *'

permissions:
  contents: read

concurrency:
  group: analysis-pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Test application
        run: python3 -m unittest discover -s tests -v
      - name: Prepare verified browser runtime
        run: python3 -m media_strazh prepare-browser
      # Reuse the private SQLite corpus from the preceding run instead of
      # starting with an empty /tmp database every half hour.
      # The cache key is unique per run, so the post-job save creates a new
      # revision; restore-keys picks the most recent available revision.
      - name: Restore accumulated news history
        if: github.ref == 'refs/heads/main' && !inputs.benchmark
        uses: actions/cache@v4
        with:
          path: /tmp/media-strazh-pilot.sqlite3
          key: media-strazh-corpus-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            media-strazh-corpus-
      # Read-only restore: a feature benchmark never saves over main's cache.
      - name: Restore history for requested benchmark
        if: github.event_name == 'workflow_dispatch' && inputs.benchmark
        uses: actions/cache/restore@v4
        with:
          path: /tmp/media-strazh-pilot.sqlite3
          key: benchmark-readonly-${{ github.run_id }}
          restore-keys: |
            media-strazh-corpus-
      - name: Record collection quality before extraction migration
        if: github.event_name == 'workflow_dispatch' && inputs.benchmark
        run: |
          mkdir -p /tmp/quality-report
          python3 -m media_strazh status --db /tmp/media-strazh-pilot.sqlite3 > /tmp/quality-report/before.json
      - name: Refresh outdated extracted texts without downloading publishers
        run: python3 -m media_strazh reextract --db /tmp/media-strazh-pilot.sqlite3 --outdated-only
      - name: Reanalyze retained publications with the current rules
        run: python3 -m media_strazh reanalyze --db /tmp/media-strazh-pilot.sqlite3
      - name: Collect a fresh, bounded sample
        if: ${{ !inputs.benchmark }}
        shell: bash
        run: |
          set +e
          python3 -m media_strazh collect --db /tmp/media-strazh-pilot.sqlite3 --limit 2 --time-budget-seconds 900 --verbose
          collection_exit=$?
          set -e
          if [ "$collection_exit" -gt 1 ]; then
            exit "$collection_exit"
          fi
      - name: Prepare human review corpus
        if: github.event_name == 'workflow_dispatch' && inputs.benchmark
        run: |
          python3 -m media_strazh prepare-benchmark --db /tmp/media-strazh-pilot.sqlite3 --output /tmp/review-corpus --size 240
          python3 -m media_strazh status --db /tmp/media-strazh-pilot.sqlite3 > /tmp/quality-report/after.json
          python3 -m media_strazh evaluate-benchmark --file /tmp/review-corpus/development.jsonl > /tmp/review-corpus/annotation-status.json
      - name: Summarize corpus audit
        if: github.event_name == 'workflow_dispatch' && inputs.benchmark
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          from media_strazh.storage import Store
          root=Path('/tmp/quality-report')
          audit={}
          for name in ('before','after'):
              value=json.loads((root/(name+'.json')).read_text())['quality']
              audit[name]={key:value[key] for key in ('collected','undated','future_dated')}
              audit[name]['undated_by_source']={r['id']:r['undated'] for r in value['sources'] if r['undated']}
          m=json.loads(Path('/tmp/review-corpus/manifest.json').read_text())
          audit['benchmark']={key:m[key] for key in ('size','splits','platforms','sources','duplicates_excluded','excluded_known_development')}
          with Store('/tmp/media-strazh-pilot.sqlite3') as store:
              rows=store.db.execute('SELECT a.source_id,r.canonical_url AS url FROM articles a JOIN revisions r ON r.id=a.current_revision_id WHERE julianday(r.published_at) IS NULL ORDER BY a.source_id,a.id')
              examples={}
              for row in rows:
                  examples.setdefault(row['source_id'],[])
                  if len(examples[row['source_id']])<2: examples[row['source_id']].append(row['url'])
              audit['undated_examples']=examples
          Path('/tmp/review-corpus/audit-summary.json').write_text(json.dumps(audit,ensure_ascii=False,indent=2))
          message=json.dumps(audit,ensure_ascii=False).replace('%','%25').replace('\r','%0D').replace('\n','%0A')
          print('::notice title=Corpus audit::'+message)
          # Full originals/manifest stay in the artifact; keep notices concise.
          import hashlib
          m.pop('documents')
          m['manifest_sha256']=hashlib.sha256(Path('/tmp/review-corpus/manifest.json').read_bytes()).hexdigest()
          header=json.dumps(m,ensure_ascii=False).replace('%','%25').replace('\r','%0D').replace('\n','%0A')
          print('::notice title=Review manifest header::'+header)
          PY
      - name: Upload review corpus and quality audit
        if: github.event_name == 'workflow_dispatch' && inputs.benchmark
        uses: actions/upload-artifact@v4
        with:
          name: review-corpus-${{ github.run_id }}
          path: |
            /tmp/review-corpus
            /tmp/quality-report
          retention-days: 30
      - name: Build public site
        run: python3 -m media_strazh build-site --db /tmp/media-strazh-pilot.sqlite3 --output _site --limit 100
      - name: Install browser test tools
        if: github.event_name != 'schedule'
        run: |
          python3 -m pip install playwright==1.62.0
          python3 -m playwright install --with-deps chromium
      - name: Check browser analysis against Python
        if: github.event_name != 'schedule'
        run: python3 tests/browser_manual_check.py --site _site
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
  deploy:
    if: github.ref == 'refs/heads/main' && !inputs.benchmark
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
    steps:
      - name: Deploy GitHub Pages
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
